<!DOCTYPE html>
<html>
  <head>
    <title>
      Pricing Plans
    </title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1 style="text-align: center;">Choose Your Plan</h1>
    <div class="plans-wrapper">
      <div class="plan-card">
        <h2 class="plan-name">
          Basic
        </h2>
        <div class="plan-price">
          ₹199/mo
        </div>
        <div class="plan-features">
         <p>• 1 screen</p> 
          <p>• SD</p>
        </div>
        <div class="plan-button">
          <button>Choose</button>
        </div>
      </div>
      <div class="plan-card featured" >
        <h2 class="plan-name">
          Standard
        </h2>
        <div class="plan-price">
          ₹399/mo
        </div>
        <div class="plan-features">
         <p>• 2 screens</p> 
          <p>• HD</p>
          <p>• No ads</p>
        </div>
        <div class="plan-button">
          <button>Choose</button>
        </div>
      </div>
      <div class="plan-card">
        <h2 class="plan-name">
          Premium
        </h2>
        <div class="plan-price">
          ₹599/mo
        </div>
        <div class="plan-features">
         <p>• 4 screens</p> 
          <p>• 4k</p>
          <p>• No ads</p>
          <p>• Offline download</p>
        </div>
        <div class="plan-button">
           <button>Choose</button>
        </div>
      </div>
    </div>
  </body>
</html>
